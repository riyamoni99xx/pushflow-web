<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" /><title>Create Account — PushFlow</title><link rel="icon" type="image/png" href="https://raw.githubusercontent.com/M41NUL/pushflow-web/main/img/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><script type="module" src="firebase-config.js"></script><style>:root{  --bg:#08080a;  --panel:#0e0e11;  --surface:rgba(255,255,255,0.045);  --surface-2:rgba(255,255,255,0.075);  --border:rgba(255,255,255,0.10);  --border-hi:rgba(255,255,255,0.20);  --amber-1:#FFD84A;  --amber-2:#FFB020;  --amber-3:#FF8A00;  --white:#FFFFFF;  --text:#F3F3F5;  --text-dim:#9C9CA6;  --text-faint:#5B5B65;  --radius-lg:26px;  --radius-md:16px;  --radius-sm:10px;  --shadow-soft: 0 18px 46px -22px rgba(0,0,0,0.75);  --font-display:'Space Grotesk', sans-serif;  --font-body:'Inter', sans-serif;  --font-mono:'JetBrains Mono', monospace;}*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%;}body{  background:    radial-gradient(ellipse 900px 620px at 12% -8%, rgba(255,176,32,0.10), transparent 60%),    radial-gradient(ellipse 800px 700px at 100% 8%, rgba(255,138,0,0.07), transparent 55%),    var(--bg);  color:var(--text);  font-family:var(--font-body);  min-height:100vh;  overflow-x:hidden;  -webkit-font-smoothing:antialiased;  display:flex;  flex-direction:column;}::selection{background:rgba(255,176,32,0.30);color:#fff;}a{color:inherit;text-decoration:none;}button{font-family:inherit;cursor:pointer;}:focus-visible{outline:2px solid var(--amber-2);outline-offset:3px;border-radius:8px;}@media (prefers-reduced-motion: reduce){  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}}.top{padding:22px 28px;display:flex;justify-content:center;}.brand-mark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-0.01em;}.logo-img{height:43px;width:auto;display:block;}.stage{  flex:1;  display:flex;  align-items:center;  justify-content:center;  padding:20px 20px 60px;  position:relative;}.card{  width:100%;  max-width:420px;  background:rgba(255,255,255,0.05);  border:1px solid rgba(255,255,255,0.12);  backdrop-filter:blur(26px) saturate(180%);  -webkit-backdrop-filter:blur(26px) saturate(180%);  border-radius:var(--radius-lg);  box-shadow:    inset 0 1px 0 rgba(255,255,255,0.14),    inset 0 0 0 1px rgba(255,255,255,0.02),    var(--shadow-soft);  padding:38px 32px 32px;  opacity:0;  transform:translateY(18px);  animation:cardIn .6s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes cardIn{to{opacity:1;transform:translateY(0);}}.eyebrow{  font-family:var(--font-mono);  font-size:12px;  letter-spacing:0.14em;  text-transform:uppercase;  color:var(--amber-2);  display:flex;  align-items:center;  gap:8px;  margin-bottom:14px;}.eyebrow svg{color:var(--amber-2);}h1{  font-family:var(--font-display);  font-weight:600;  font-size:28px;  letter-spacing:-0.02em;  margin-bottom:8px;}.sub{color:var(--text-dim);font-size:14.5px;line-height:1.6;margin-bottom:26px;}.sub a{color:var(--amber-2);font-weight:600;}.sub a:hover{text-decoration:underline;}.oauth-group{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}.oauth-btn{  display:flex;align-items:center;justify-content:center;gap:10px;  width:100%;padding:12px 18px;border-radius:100px;  background:var(--surface-2);border:1px solid var(--border-hi);  color:var(--white);font-weight:600;font-size:14.5px;  transition:transform .25s cubic-bezier(.2,.8,.2,1), background .25s, border-color .25s;}.oauth-btn:hover{background:rgba(255,255,255,0.13);transform:translateY(-2px);}.oauth-btn:active{transform:translateY(0) scale(0.98);}.oauth-btn svg{flex-shrink:0;}.divider{  display:flex;align-items:center;gap:14px;  color:var(--text-faint);font-size:12.5px;  margin-bottom:22px;}.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}form{display:flex;flex-direction:column;gap:16px;}.field{display:flex;flex-direction:column;gap:7px;}.field label{font-size:13px;font-weight:600;color:var(--text-dim);}.field-row{display:flex;gap:12px;}.field-row .field{flex:1;min-width:0;}.field-input-wrap{position:relative;}.field input{  width:100%;  background:var(--panel);  border:1px solid var(--border);  border-radius:var(--radius-sm);  padding:12px 14px;  color:var(--text);  font-family:var(--font-body);  font-size:14.5px;  transition:border-color .2s, box-shadow .2s;}.field input::placeholder{color:var(--text-faint);}.field input:focus{  outline:none;  border-color:var(--amber-2);  box-shadow:0 0 0 3px rgba(255,176,32,0.14);}.field-input-wrap .toggle-visibility{  position:absolute;right:12px;top:50%;transform:translateY(-50%);  background:none;border:none;color:var(--text-faint);  padding:4px;display:flex;align-items:center;}.field-input-wrap .toggle-visibility:hover{color:var(--text-dim);}.pw-strength{display:flex;gap:5px;margin-top:2px;}.pw-strength span{height:3px;flex:1;border-radius:3px;background:var(--border);transition:background .25s;}.pw-hint{font-size:12px;color:var(--text-faint);margin-top:2px;}.terms{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--text-dim);line-height:1.5;margin-top:2px;}.terms input[type="checkbox"]{  appearance:none;width:16px;height:16px;border-radius:5px;flex-shrink:0;margin-top:1px;  border:1px solid var(--border-hi);background:var(--panel);  cursor:pointer;position:relative;}.terms input[type="checkbox"]:checked{background:linear-gradient(135deg,var(--amber-1),var(--amber-3));border-color:transparent;}.terms input[type="checkbox"]:checked::after{  content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;  border:solid #1a1200;border-width:0 2px 2px 0;transform:rotate(45deg);}.terms a{color:var(--amber-2);font-weight:600;}.terms a:hover{text-decoration:underline;}.btn-primary{  display:flex;align-items:center;justify-content:center;gap:9px;  width:100%;margin-top:6px;  background:linear-gradient(100deg, var(--amber-1) 0%, var(--amber-3) 100%);  color:#1a1200;font-weight:700;font-size:15px;  padding:13px 26px;border-radius:100px;border:none;  box-shadow:0 10px 24px -10px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.35);  transition:transform .25s cubic-bezier(.2,.8,.2,1);}.btn-primary:hover{transform:translateY(-2px);}.btn-primary:active{transform:translateY(0) scale(0.98);}.btn-primary:disabled{opacity:0.55;cursor:not-allowed;transform:none;}.err{  display:none;  font-size:13px;color:#FF8A80;  background:rgba(255,90,70,0.09);  border:1px solid rgba(255,90,70,0.25);  border-radius:var(--radius-sm);  padding:10px 13px;}.err.show{display:block;}.foot-note{  text-align:center;color:var(--text-faint);font-size:12.5px;  margin-top:26px;line-height:1.6;}.foot-note a{color:var(--text-dim);font-weight:600;}.foot-note a:hover{color:var(--amber-2);}.back-home{  position:fixed;top:24px;left:24px;  display:flex;align-items:center;gap:6px;  color:var(--text-faint);font-size:13px;font-weight:600;  padding:8px 14px;border-radius:100px;border:1px solid transparent;  transition:color .2s, border-color .2s, background .2s;}.back-home:hover{color:var(--text);border-color:var(--border);background:var(--surface);}@media (max-width:480px){  .card{padding:30px 22px 26px;}  .field-row{flex-direction:column;gap:16px;}  .back-home{position:static;margin:0 auto 4px;width:fit-content;}  .top{padding:18px 18px 0;}}</style></head><body><a href="index.html" class="back-home">  <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>  Back to home</a><div class="top">  <a href="index.html" class="brand-mark">    <img src="https://raw.githubusercontent.com/M41NUL/pushflow-web/main/img/logo.png" alt="PushFlow" class="logo-img" />  </a></div><div class="stage">  <div class="card">    <div class="eyebrow">      <svg viewBox="0 0 24 24" width="7" height="7"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>      GET STARTED — IT'S FREE    </div>    <h1>Create your account</h1>    <p class="sub">Already have one? <a href="login.html">Log in</a></p>    <div class="err" id="formErr">Something's not right. Please check the fields below.</div>    <form id="registerForm" novalidate>      <div class="field-row">        <div class="field">          <label for="fname">First name</label>          <input type="text" id="fname" name="fname" placeholder="Jane" autocomplete="given-name" required />        </div>        <div class="field">          <label for="lname">Last name</label>          <input type="text" id="lname" name="lname" placeholder="Doe" autocomplete="family-name" required />        </div>      </div>      <div class="field">        <label for="email">Email</label>        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />      </div>      <div class="field">        <label for="phone">Phone number</label>        <input type="tel" id="phone" name="phone" placeholder="+880 1XXXXXXXXX" autocomplete="tel" required />      </div>      <div class="field">        <label for="password">Password</label>        <div class="field-input-wrap">          <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" required minlength="8" />          <button type="button" class="toggle-visibility" id="togglePw" aria-label="Show password">            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>          </button>        </div>        <div class="pw-strength" id="pwStrength">          <span></span><span></span><span></span><span></span>        </div>        <div class="pw-hint">Use at least 8 characters, with a number or symbol.</div>      </div>      <label class="terms">        <input type="checkbox" id="agree" name="agree" required />        <span>I agree to PushFlow's <a href="index.html">Terms of Service</a> and <a href="index.html">Privacy Policy</a>.</span>      </label>      <button type="submit" class="btn-primary" id="submitBtn">Create Account</button>    </form>    <p class="foot-note">Free up to 1,000 subscribers. No credit card required.</p>  </div></div><script>  // Password visibility toggle  const pw = document.getElementById('password');  const toggle = document.getElementById('togglePw');  toggle.addEventListener('click', () => {    const isPw = pw.type === 'password';    pw.type = isPw ? 'text' : 'password';    toggle.setAttribute('aria-label', isPw ? 'Hide password' : 'Show password');  });  // Password strength meter  const bars = document.querySelectorAll('#pwStrength span');  const strengthColors = ['#FF5A46', '#FF8A00', '#FFD84A', '#3DDC97'];  function scorePassword(value) {    let score = 0;    if (value.length >= 8) score++;    if (/[A-Z]/.test(value) && /[a-z]/.test(value)) score++;    if (/\d/.test(value)) score++;    if (/[^A-Za-z0-9]/.test(value)) score++;    return score;  }  pw.addEventListener('input', () => {    const score = scorePassword(pw.value);    bars.forEach((bar, i) => {      bar.style.background = i < score ? strengthColors[score - 1] : 'var(--border)';    });  });  // Real registration wired to the PushFlow backend (see firebase-config.js)  const form = document.getElementById('registerForm');  const err = document.getElementById('formErr');  const submitBtn = document.getElementById('submitBtn');  function showError(message) {    err.textContent = message;    err.classList.add('show');  }  function setLoading(isLoading) {    submitBtn.disabled = isLoading;    submitBtn.textContent = isLoading ? 'Creating account…' : 'Create Account';  }  form.addEventListener('submit', async (e) => {    e.preventDefault();    err.classList.remove('show');    const fname = document.getElementById('fname').value.trim();    const lname = document.getElementById('lname').value.trim();    const email = document.getElementById('email').value.trim();    const phone = document.getElementById('phone').value.trim();    const password = document.getElementById('password').value;    const agree = document.getElementById('agree').checked;    if (!fname || !lname || !email || !phone || !password) {      showError('Please fill in all fields.');      return;    }    if (password.length < 8) {      showError('Password must be at least 8 characters.');      return;    }    if (!agree) {      showError('Please accept the Terms of Service and Privacy Policy.');      return;    }    setLoading(true);    try {      await window.PushFlowAuth.registerWithEmail({ fname, lname, email, phone, password });      // Remember this login on this device by default so the person doesn't      // have to retype it right after creating the account.      localStorage.setItem('pf_remembered_login', JSON.stringify({ email, password }));      window.location.href = 'dashboard.html';    } catch (ex) {      showError(ex.message || 'Could not create account. Please try again.');    } finally {      setLoading(false);    }  });</script></body></html>
